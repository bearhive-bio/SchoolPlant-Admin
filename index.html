<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教師管理後台 - 校園植物辨識</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-4 md:p-8">

    <div class="max-w-[1400px] mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-black text-slate-800 flex items-center gap-2">
                <span class="text-4xl">🛠️</span> 植物辨識測驗管理後台
            </h1>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
            <h2 class="text-xl font-bold text-emerald-600 mb-4 flex items-center gap-2">
                <span>➕</span> 新增測驗題目
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-4">
                    <select id="qLevel" class="w-full border border-slate-300 p-3 rounded-xl focus:ring-2 focus:ring-emerald-500">
                        <option value="STEAM校園探索路線">等級一：STEAM校園探索路線</option>
                        <option value="華興植物誌">等級二：華興植物誌</option>
                    </select>
                    <select id="qType" onchange="toggleInputType()" class="w-full border border-slate-300 p-3 rounded-xl focus:ring-2 focus:ring-emerald-500">
                        <option value="text">題目類型：純文字描述</option>
                        <option value="image">題目類型：圖片辨識 (上傳照片)</option>
                    </select>
                    <div id="textInputArea">
                        <textarea id="qContentText" placeholder="輸入題目內容（例如：請問此植物的特徵是？）" class="w-full border border-slate-300 p-3 rounded-xl h-24 outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                    </div>
                    <div id="imageInputArea" class="hidden">
                        <input type="file" id="qContentFile" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
                    </div>
                </div>
                <div class="space-y-3">
                    <input type="text" id="opt1" placeholder="選項 A (正確答案)" class="w-full border border-emerald-200 p-3 rounded-xl bg-emerald-50 focus:ring-2 focus:ring-emerald-500">
                    <input type="text" id="opt2" placeholder="選項 B" class="w-full border border-slate-300 p-3 rounded-xl">
                    <input type="text" id="opt3" placeholder="選項 C" class="w-full border border-slate-300 p-3 rounded-xl">
                    <input type="text" id="opt4" placeholder="選項 D" class="w-full border border-slate-300 p-3 rounded-xl">
                    <button onclick="addQuestion()" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-md">
                        儲存並新增題目
                    </button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[700px]">
                <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                    <h2 class="font-bold text-slate-700 flex items-center gap-2">
                        <span>📚</span> 目前題庫庫存 (<span id="qCount">0</span>)
                    </h2>
                </div>
                <div id="qList" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50">
                    <p class="text-center text-slate-400 py-10">讀取中...</p>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[700px]">
                <div class="p-5 border-b border-slate-100 bg-slate-50">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <h2 class="font-bold text-slate-700 flex items-center gap-2">
                            <span>📝</span> 學生測驗成績單
                        </h2>
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-slate-500">篩選班級:</span>
                            <select id="classFilter" onchange="renderRecords()" class="text-sm border border-slate-300 rounded-lg p-1 px-2 focus:ring-2 focus:ring-emerald-500 outline-none">
                                <option value="all">全部班級</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="flex-1 overflow-y-auto p-0 bg-white">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 bg-white shadow-sm z-10">
                            <tr class="text-xs uppercase text-slate-400 font-bold border-b border-slate-100">
                                <th class="px-6 py-4">班級座號</th>
                                <th class="px-6 py-4">姓名</th>
                                <th class="px-6 py-4">測驗路線</th>
                                <th class="px-6 py-4">成績</th>
                                <th class="px-6 py-4">時間</th>
                            </tr>
                        </thead>
                        <tbody id="recordTable" class="text-sm text-slate-600 divide-y divide-slate-50">
                            </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbM2BgbSe8Ki6ycGPMeBppWJEWKU9r7ic",
            authDomain: "schoolplant-question.firebaseapp.com",
            projectId: "schoolplant-question",
            storageBucket: "schoolplant-question.firebasestorage.app",
            messagingSenderId: "555043171839",
            appId: "1:555043171839:web:40f6821f31e38607dd0bca",
            measurementId: "G-FH4YQXJ5M4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let allRecords = []; // 儲存所有成績

        // 切換輸入類型
        window.toggleInputType = () => {
            const type = document.getElementById('qType').value;
            document.getElementById('textInputArea').classList.toggle('hidden', type !== 'text');
            document.getElementById('imageInputArea').classList.toggle('hidden', type !== 'image');
        };

        // 新增題目
        window.addQuestion = async () => {
            const btn = document.getElementById('submitBtn');
            const level = document.getElementById('qLevel').value;
            const type = document.getElementById('qType').value;
            const options = [
                document.getElementById('opt1').value.trim(),
                document.getElementById('opt2').value.trim(),
                document.getElementById('opt3').value.trim(),
                document.getElementById('opt4').value.trim()
            ];
            const answer = options[0];

            if(!options[0] || !options[1]) return alert("請至少填寫 A 和 B 兩個選項！");

            btn.disabled = true;
            btn.innerText = "上傳中...";

            try {
                let content = "";
                if(type === 'text') {
                    content = document.getElementById('qContentText').value.trim();
                } else {
                    const file = document.getElementById('qContentFile').files[0];
                    if(!file) throw new Error("請選擇圖片檔案");
                    const storageRef = ref(storage, `plants/${Date.now()}_${file.name}`);
                    const uploadResult = await uploadBytes(storageRef, file);
                    content = await getDownloadURL(uploadResult.ref);
                }

                await addDoc(collection(db, "plant_questions"), {
                    level, type, content, options, answer, createdAt: serverTimestamp()
                });

                alert("題目新增成功！");
                location.reload();
            } catch (e) {
                alert("錯誤：" + e.message);
                btn.disabled = false;
                btn.innerText = "儲存並新增題目";
            }
        };

        // 監聽題庫列表
        onSnapshot(query(collection(db, "plant_questions"), orderBy("createdAt", "desc")), (snapshot) => {
            const qList = document.getElementById('qList');
            document.getElementById('qCount').innerText = snapshot.size;
            qList.innerHTML = "";
            snapshot.forEach(d => {
                const q = d.data();
                const div = document.createElement('div');
                div.className = "bg-white p-4 rounded-xl border border-slate-200 shadow-sm relative group";
                const badgeColor = q.level === "STEAM校園探索路線" ? "bg-amber-100 text-amber-700" : "bg-purple-100 text-purple-700";
                
                div.innerHTML = `
                    <div class="flex gap-4">
                        ${q.type === 'image' ? `<img src="${q.content}" class="w-20 h-20 object-cover rounded-lg">` : `<div class="w-20 h-20 bg-slate-100 flex items-center justify-center rounded-lg text-xs p-2 overflow-hidden">${q.content}</div>`}
                        <div class="flex-1">
                            <span class="text-[10px] font-bold px-2 py-1 rounded-full ${badgeColor}">${q.level}</span>
                            <p class="text-sm font-bold mt-2 text-slate-700">正解：${q.answer}</p>
                            <p class="text-xs text-slate-400 mt-1">選項：${q.options.join(', ')}</p>
                        </div>
                    </div>
                    <button onclick="deleteQ('${d.id}')" class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 text-red-400 hover:text-red-600 transition text-xs">刪除</button>
                `;
                qList.appendChild(div);
            });
        });

        // 刪除題目
        window.deleteQ = async (id) => {
            if(confirm("確定要刪除這道題目嗎？")) {
                await deleteDoc(doc(db, "plant_questions", id));
            }
        };

        // 監聽並渲染成績單
        onSnapshot(query(collection(db, "student_records"), orderBy("submitTime", "desc")), (snapshot) => {
            allRecords = [];
            const classes = new Set();
            
            snapshot.forEach(d => {
                const r = d.data();
                allRecords.push(r);
                if(r.className) classes.add(r.className);
            });

            // 更新班級篩選選單
            const filter = document.getElementById('classFilter');
            const currentVal = filter.value;
            filter.innerHTML = `<option value="all">全部班級</option>`;
            Array.from(classes).sort().forEach(c => {
                filter.innerHTML += `<option value="${c}">${c}</option>`;
            });
            filter.value = currentVal;

            renderRecords();
        });

        // 渲染表格 (支援篩選)
        window.renderRecords = () => {
            const filterVal = document.getElementById('classFilter').value;
            const table = document.getElementById('recordTable');
            table.innerHTML = "";

            const filtered = filterVal === "all" ? allRecords : allRecords.filter(r => r.className === filterVal);

            filtered.forEach(r => {
                const date = r.submitTime ? r.submitTime.toDate().toLocaleString('zh-TW', {hour12:false}) : "上傳中...";
                const row = `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="px-6 py-4 font-medium text-slate-900">${r.className} (${r.seat})</td>
                        <td class="px-6 py-4">${r.name}</td>
                        <td class="px-6 py-4 text-xs font-bold">${r.route}</td>
                        <td class="px-6 py-4">
                            <span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-bold">${r.score} / ${r.totalQuestions}</span>
                        </td>
                        <td class="px-6 py-4 text-[10px] text-slate-400">${date}</td>
                    </tr>
                `;
                table.innerHTML += row;
            });
        };
    </script>
</body>
</html>
